name: Deploy GitHub Pages

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Stage static site
        run: |
          mkdir _site
          cp index.html sueder-morais-cv.pdf CNAME _site/
      - uses: actions/upload-pages-artifact@v5

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    concurrency: github-pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
